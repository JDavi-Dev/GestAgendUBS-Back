/horarios:
  get:
    tags:
    - Horários
    summary: Listar horários
    description: ''
    responses:
      '200':
        description: Lista.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Horario'
      '401': &id002
        description: Não autenticado ou credenciais inválidas.
        content:
          application/json:
            schema: &id001
              $ref: '#/components/schemas/Mensagem'
      '500': &id003
        description: Erro interno ou problema com o banco de dados.
        content:
          application/json:
            schema: *id001
    security: &id004
    - bearerAuth: []
    parameters:
    - name: profissional_id
      in: query
      schema:
        type: integer
    - name: data
      in: query
      schema:
        type: string
        format: date
    - name: apenas_disponiveis
      in: query
      schema:
        type: boolean
        default: false
  post:
    tags:
    - Horários
    summary: Criar horário
    description: Apenas administrador. Rejeita sobreposição de horários do mesmo profissional.
    responses:
      '201':
        description: Horário criado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Horario'
      '401': *id002
      '403': &id006
        description: Acesso negado.
        content:
          application/json:
            schema: *id001
      '404': &id005
        description: Recurso não encontrado.
        content:
          application/json:
            schema: *id001
      '409': &id007
        description: Conflito com o estado atual do recurso.
        content:
          application/json:
            schema: *id001
      '500': *id003
    security: *id004
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HorarioCriacao'
/horario/{id}:
  get:
    tags:
    - Horários
    summary: Obter horário por ID
    description: ''
    responses:
      '200':
        description: Horário encontrado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Horario'
      '401': *id002
      '404': *id005
      '500': *id003
    security: *id004
    parameters:
    - &id008
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  put:
    tags:
    - Horários
    summary: Atualizar horário próprio
    description: Apenas o profissional dono do horário. Não permite indisponibilizar horário com agendamento ativo.
    responses:
      '200':
        description: Horário atualizado.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Horario'
      '401': *id002
      '403': *id006
      '404': *id005
      '409': *id007
      '500': *id003
    security: *id004
    parameters:
    - *id008
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  delete:
    tags:
    - Horários
    summary: Excluir horário
    description: Apenas administrador e somente quando não houver agendamentos associados.
    responses:
      '200':
        description: Horário removido.
        content:
          application/json:
            schema: *id001
      '401': *id002
      '403': *id006
      '404': *id005
      '409': *id007
      '500': *id003
    security: *id004
    parameters:
    - *id008
